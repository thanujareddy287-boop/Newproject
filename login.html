<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="card">
    <h1>Login</h1>
    <form id="loginForm">
        <input id="email" type="email" placeholder="Email" required maxlength="190">
        <input id="password" type="password" placeholder="Password" required minlength="8" maxlength="72">
        <button type="submit">Login</button>
    </form>
    <p id="message"></p>
    <a href="/register.html">Create account</a>
</div>
<script src="/js/auth.js"></script>
</body>
</html>
